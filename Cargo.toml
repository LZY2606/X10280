[package]
name = "frame-ribbon"
version = "0.1.0"
edition = "2021"
description = "SMPTE timecode / drop-frame / multi-source alignment review workbench"

[[bin]]
name = "frame-ribbon"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
