[package]
name = "frame_ribbon"
version = "0.1.0"
edition = "2021"
description = "SMPTE timecode / drop-frame / multi-source alignment workbench (offline)"
license = "MIT"

[[bin]]
name = "frame_ribbon"
path = "src/main.rs"

[lib]
name = "frame_ribbon"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
fnv = "1.0"

[dev-dependencies]
tempfile = "3"
