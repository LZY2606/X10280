[package]
name = "frame-loom"
version = "0.1.0"
edition = "2021"
description = "帧号织带 — SMPTE 时码 / drop-frame / 多源对齐工作台"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
