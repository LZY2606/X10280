[package]
name = "tc-workbench"
version = "1.0.0"
edition = "2021"
description = "SMPTE timecode / drop-frame / multi-source alignment review workbench"

[[bin]]
name = "tc-workbench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "gen_cases"
path = "examples/gen_cases.rs"
