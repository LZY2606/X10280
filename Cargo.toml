[package]
name = "tcworkbench"
version = "0.1.0"
edition = "2021"
description = "SMPTE timecode / drop-frame / multi-source alignment workbench"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"

[profile.dev]
opt-level = 0
