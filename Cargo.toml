[package]
name = "timecode-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "timecode-bench"
path = "src/main.rs"

[lib]
name = "timecode_bench"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
once_cell = "1"

[profile.dev]
opt-level = 0
