[package]
name = "smpte-workbench"
version = "0.1.0"
edition = "2021"
description = "Offline SMPTE timecode / drop-frame / multi-source alignment review workbench"

[[bin]]
name = "smpte-workbench"
path = "src/main.rs"

[lib]
name = "smpte_workbench"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"
hex = "0.4"
rust-embed = "8"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.test]
opt-level = 1
