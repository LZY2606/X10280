[package]
name = "timecode-workbench"
version = "0.1.0"
edition = "2021"

[lib]
name = "tcwb"
path = "src/lib.rs"

[[bin]]
name = "timecode-workbench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
panic = "abort"
