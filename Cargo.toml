[package]
name = "tc-workbench"
version = "0.1.0"
edition = "2021"
description = "SMPTE timecode / drop-frame / multi-source alignment workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 1
